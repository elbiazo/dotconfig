# =============================================================================
# tmux.conf - tmux configuration
#
# Vim-style pane navigation and resizing.
# Prefix key: Ctrl-b (default)
# =============================================================================

# --- Pane resizing (Ctrl + hjkl) ---
bind C-k resize-pane -U
bind C-j resize-pane -D
bind C-h resize-pane -L
bind C-l resize-pane -R

# --- Pane navigation (hjkl) ---
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# --- Window management ---
bind c new-window -c "#{pane_current_path}"

# --- Splitting ---
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# --- Disable arrow-key defaults (we use hjkl instead) ---
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# --- Mouse support ---
# Click windows/panes to select, drag borders to resize, and scroll the
# pane's history directly with the wheel (no manual copy-mode needed).
set -g mouse on

# Scroll wheel enters copy-mode automatically and scrolls by 3 lines;
# releasing the mouse in copy-mode does NOT clear the selection/exit.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# --- Terminal settings ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g allow-passthrough on

# --- Remove ESC delay for snappy vim/neovim mode switching ---
set -sg escape-time 0
